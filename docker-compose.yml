# Fully local: Postgres, Long Tail (API + dashboard + relay) and a DBOS app. Nothing calls out.
# docker compose up -d --build
# Start a review: curl -X POST localhost:4000/orders/42, then resolve it at http://localhost:3400
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: longtail
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5425}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  long-tail:
    build: { context: ., target: runtime }
    environment:
      # DBOS keeps its system tables in this database, in the dbos schema.
      DATABASE_URL: postgresql://postgres:password@postgres:5432/longtail
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me-local-only}
      LT_ADMIN_USER: superadmin
      LT_ADMIN_PASSWORD: ${LT_ADMIN_PASSWORD:-l0ngt@1l}
      LT_ROLES: reviewer,line-bond,line-finish,line-exit,line-operator,line-quality
      # Registers the example workflows, so the Invoke Tool and the invoke API can start them.
      LT_START_CONFIG: /config/long-tail.json
    volumes:
      - ./examples/long-tail.json:/config/long-tail.json:ro
    ports:
      - "${LT_PORT:-3400}:3000"
    depends_on:
      postgres: { condition: service_healthy }

  examples:
    build: { context: ., target: example }
    environment:
      LT_URL: http://long-tail:3000
      LT_API_KEY: ${LT_API_KEY:-}
      # Local demo: with no LT_API_KEY, the app signs in as the admin and mints a bot key.
      LT_ADMIN_USER: superadmin
      LT_ADMIN_PASSWORD: ${LT_ADMIN_PASSWORD:-l0ngt@1l}
      DBOS_SYSTEM_DATABASE_URL: postgresql://postgres:password@postgres:5432/longtail
      # Stable identity per replica: a restarted container recovers its own parked waits.
      DBOS__VMID: examples-1
      # Pinned version: a redeploy recovers waits parked by earlier code. Change code paths with DBOS.patch.
      DBOS__APPVERSION: examples-v1
    ports:
      - "${APP_PORT:-4000}:4000"
    depends_on:
      postgres: { condition: service_healthy }
      long-tail: { condition: service_started }

volumes:
  pgdata:
